modLoader = "javafml"
loaderVersion = "${loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/KokuuWork/voidkit/issues"

[[mods]]
modId = "voidkit_guard"
version = "${mod_version}"
displayName = "VoidkitGuard"
authors = "Kokuu Studio"
description = '''
VoidkitGuard 反作弊组件 —— 服务端校验端。

负责客户端完整性校验（智能识别 / 哈希锁）、多身份封禁、截屏接收与取证、
全量审计、深度扫描与综合判定。客户端 Agent 由 voidkit_guard_client 提供。

依赖 voidkit_core。
'''

# ⚠️ Forge 1.21.1 的 loader modId 是 "forge"（不是 "neoforge"）——
#    写错会导致 mod 被跳过加载。
[[dependencies.voidkit_guard]]
modId = "forge"
mandatory = true
versionRange = "${neo_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_guard]]
modId = "minecraft"
mandatory = true
versionRange = "${mc_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_guard]]
modId = "voidkit_core"
mandatory = true
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "SERVER"