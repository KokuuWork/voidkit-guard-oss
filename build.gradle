plugins {
    id 'net.minecraftforge.gradle' version '[7.0.3,8)' apply false
    // FG7 把 Jar-in-Jar 拆成了独立插件（FG5/6 的 jarJar.enable() 已不存在）。
    // 官方示例：MDKExamples/jarjar-only/fg7-kotlin
    id 'net.minecraftforge.jarjar' version '0.2.3' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.4.21' apply false
}

// ==============================================================
// 公共版本。与 voidkit 主仓库保持一致。
// ==============================================================
ext {
    // 全部 release 均为测试版（pre-release），不建议用于生产环境。
    // 与 voidkit 套件其余模块保持同一命名规格：<mod>-0.1.0-beta.1+mc<版本>-<loader>.jar。
    // ⚠️ 版本字面量必须是合法语义化版本：NeoForge/Forge 的 mods.toml 都拒绝
    // 'beta0.1' 这类非数字开头形式（InvalidModFileException: Illegal version
    // number，整个 jar 被跳过不加载，已实测复现）。人类命名 beta0.1 只出现在
    // release title / notes，不进版本号。
    guardVersion = '0.1.0-beta.1'
    guardGroup = 'org.voidkit'
    guardAuthors = 'Kokuu Studio'
    guardLicense = 'MIT'

    mcVersion = '1.21.1'
    // Forge 1.21.1 = Forge 52.x（ForgeGradle 7）。
    // ⚠️ Forge 1.21.1 运行时用**官方映射**（不是 SRG）→ **不需要 reobf**，
    //    build/libs 的 jar 就是发布产物（与 mc/1.20.1 线完全不同）。
    forgeVersion = '1.21.1-52.1.19'
    // ⚠️ 变量名沿用 ${neo_range}（mods.toml 里的占位符），值是 Forge 依赖区间。
    neoRange = '[52,)'
    mcRange = '[1.21.1,1.22)'
    loaderRange = '[52,)'

    kotlinVersion = '2.4.21'

    // 封禁/审计/截屏记录用嵌入式 SQLite（零配置、单文件、WAL）。
    sqliteVersion = '3.53.4.0'

    // IP 归属地离线库（ip2region，纯本地查询不联网）。数据是 v4 格式。
    ip2regionVersion = '2.7.0'
}

// ==============================================================
// 所有子项目共用：Java 21 + Kotlin + 仓库 + 编码 + 编译参数
// ==============================================================
subprojects { p ->
    apply plugin: 'java'
    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'org.jetbrains.kotlin.jvm'

    group = rootProject.ext.guardGroup
    version = rootProject.ext.guardVersion

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)
    kotlin { jvmToolchain(21) }

    repositories {
        // 🚨 ForgeGradle 的 mavenizer —— **必须调用**（官方 MDK 的原样写法）。
        //    它把 Forge maven 的元数据「maven 化」以供 minecraft.dependency(...) 解析。
        //    漏了会报：Could not isolate value ...MavenizerValueSource$Parameters。
        minecraft.mavenizer(it)
        maven fg.forgeMaven
        maven fg.minecraftLibsMaven
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        mavenCentral()
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            freeCompilerArgs.add('-Xjvm-default=all')
        }
    }
}

// ==============================================================
// server —— 服务端 mod（依赖 core）。
//
// 源码 = server/ 自有 + common/ 共享目录（协议/加密/模型/platform 接口）。
// 客户端不装 core，见下面的 client 块。
// ==============================================================
project(':server') {
    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'net.minecraftforge.jarjar'
    // core 已把 kotlin-stdlib 打进它的 jarJar（见 core/build.gradle），
    // 这里的 stdlib 只服务**开发运行时**；发布产物里 core 提供。
    // ⚠️ 不要在本项目再 jarJar 一份 kotlin-stdlib —— 两边都是 module-named jar，
    //    JPMS 会报 "reads more than one module named kotlin.stdlib"。

    def modId = 'voidkit_guard'
    base { archivesName = modId }

    // common 是共享源码目录，直接编进本 jar（不是独立 Gradle 项目）
    sourceSets.main.kotlin.srcDir rootProject.file('common/src/main/kotlin')

    // ForgeGradle 7：官方映射（1.21.1 不用 SRG，不需要 reobf）
    minecraft {
        mappings channel: 'official', version: rootProject.ext.mcVersion
    }

    dependencies {
        implementation minecraft.dependency("net.minecraftforge:forge:${rootProject.ext.forgeVersion}")
    }

    jarJar.register()

    dependencies {
        // 组合构建把 org.voidkit:core 替换成本地 :core（并入主仓库时用 project(':core')）
        implementation 'org.voidkit:core:1.2.0'

        // SQLite 驱动：jarJar 内置（约 13MB 原生库）。
        // 安全：sqlite-jdbc 带 META-INF/versions/9/module-info.class（named module），
        // 不会 reads 一切，不会触发 split package。
        //
        // ⚠️ FG7 的 jarJar 依赖写进**名为 jarJar 的 configuration**（不是 jarJar(...)方法）：
        //    版本语义同 core —— 写精确版本，约束成为 [该版本,)，只锁下界，
        //    这样整合包里已有更高版本 sqlite-jdbc 时不会冲突。
        jarJar("org.xerial:sqlite-jdbc:${rootProject.ext.sqliteVersion}")
        // ⚠️ FG7 的 `jarJar` configuration **只喂打包，不进编译 classpath**
        //（ModDevGradle 的 jarJar(impl) 会同时给 implementation）。所以 sqlite
        // 必须**另外**声明一次 implementation，否则 GuardDb 编译期找不到
        // org.sqlite.SQLiteDataSource（实测报Unresolved reference 'sqlite'）。
        implementation "org.xerial:sqlite-jdbc:${rootProject.ext.sqliteVersion}"
        // ip2region 绑定（纯 Java ~100KB）；11MB xdb 走 resources。
        // ⚠️⚠️ **不能 jarJar**：ip2region 的 jar 既无 module-info.class，manifest 里
        // 也没有 Automatic-Module-Name —— 作为 unstable automatic module，JPMS 规范
        // 强制它 reads **所有** 模块。双 jar 架构下服务端/客户端 jar 都含
        // org.voidkit.guard.common 包（common 是共享源码目录），于是撞 split package：
        //   ResolutionException: Modules voidkit_guard and voidkit_guard_client
        //   export package org.voidkit.guard.common to module ip2region
        // 服务端直接起不来（1.20.1 E2E 实测复现）。sqlite/kotlin-stdlib 都带 module-info
        // （named module）所以没这个问题。
        // 纯 Java 库、无原生库、无 SPI（无 META-INF/services）→ 直接 shade 进类空间，
        // 不产生嵌套 jar module，最稳。
        implementation "org.lionsoul:ip2region:${rootProject.ext.ip2regionVersion}"
    }

    // 独立 configuration 只用于 shade：拿 ip2region 的 jar 文件本身，
    // 不掺进 implementation/runtimeClasspath 的依赖解析。
    def ip2regionShade = configurations.create('ip2regionShade')
    dependencies {
        add('ip2regionShade', "org.lionsoul:ip2region:${rootProject.ext.ip2regionVersion}")
    }

    // ⚠️ 开发运行时的原生库补充：**FG7 不需要这一段**。
    // ModDevGradle 有 `additionalRuntimeClasspath`（NeoForge 线用），
    // ForgeGradle 7 没有这个 configuration —— 开发运行时直接走
    // `runtimeOnly` / jarJar 即可（FG7 的 runs 用完整 runtimeClasspath）。
    // 保留说明是为了对照：NeoForge 线那份仍在 mc/1.20.1 与 master 分支上。

    processResources {
        def props = [
                mod_version : project.version,
                neo_range   : rootProject.ext.neoRange,
                mc_range    : rootProject.ext.mcRange,
                loader_range: rootProject.ext.loaderRange,
        ]
        inputs.properties props
        filesMatching(['META-INF/mods.toml']) { expand props }
    }

    // ⚠️ FG7 的 jarJar 产出**独立任务**（不是 jar 的一部分）：sqlite-jdbc 走它。
    //    我们让 jarJar 用规范名，普通 jar 退为 -slim（同 core 的做法）。
    tasks.named('jarJar', Jar) {
        archiveFileName = "${modId}-${project.version}+mc${rootProject.ext.mcVersion}-forge.jar"
    }
    tasks.named('jar', Jar) {
        archiveFileName = "${modId}-${project.version}+mc${rootProject.ext.mcVersion}-forge-slim.jar"
    }

    jar {
        // 产物命名规格与套件对齐：<mod>-<version>+mc<mc>-<loader>.jar
        // ip2region shade：把 org/lionsoul/** 的类并进本 jar 的类空间（不 jarJar，见上）。
        // 只取类，META-INF（MANIFEST/maven 元数据）不要 —— 避免与外层 manifest 冲突。
        // 🚨 eachFile 必须写在 from(...) 的配置闭包【里面】：from() 返回的就是 jar 任务
        // 这个 CopySpec 本身，把 eachFile 链在 from 外面会升级成整个 jar 任务的过滤器，
        // 连本体的 META-INF/mods.toml 一起剥掉 → 加载器判定
        // "not a valid mod file" 静默跳过整个 mod（Forge E2E 假阳性踩坑，2026-10-14）。
        from(provider {
            ip2regionShade.files.collect { zipTree(it) }
        }) {
            eachFile { details ->
                if (details.path.startsWith('META-INF/')) details.exclude()
            }
        }
        manifest {
            attributes([
                    'Specification-Title'   : modId,
                    'Specification-Vendor'  : rootProject.ext.guardAuthors,
                    'Specification-Version' : '1',
                    'Implementation-Title'  : 'server',
                    'Implementation-Version': project.version,
                    'Implementation-Vendor' : rootProject.ext.guardAuthors,
            ])
        }
    }
}

// ==============================================================
// client —— 客户端 mod（**零 core 依赖**）。
//
// 源码 = client/ 自有 + common/ 共享目录（重定位副本）。jar 里没有一行服务端代码，
// 也没有一行 core 引用 —— 反编译客户端拿不到服务端的密钥处理与检测策略。
// ==============================================================
project(':client') {
    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'net.minecraftforge.jarjar'

    def modId = 'voidkit_guard_client'
    base { archivesName = modId }

    // ---------- 共享包的客户端侧重定位（JPMS split package 修复） ----------
    // common/ 是共享源码目录：服务端 jar 与客户端 jar 各编一份（客户端零 core 依赖，
    // 必须独立成 jar）。但两个 jar 若含同名包，NeoForge 1.21.1 的 JPMS 模块层直接判
    // split package，服务端起不来：
    //   ResolutionException: Modules voidkit_guard and voidkit_guard_client
    //   export package org.voidkit.guard.platform to module minecraft
    // （Forge 1.20.1 的类加载器合并不报错，但同名类会互相遮蔽，同样是隐患。）
    //
    // 修法：客户端侧把共享包重定位到 org.voidkit.guard.client.* 名下，
    // 两个 jar 的包名完全不相交。用「生成式源码重定位」而非 Shadow 字节码
    // 重定位：不动 jar / reobfJar / jarJar 构建管线，两分支通用，产物可逐行审。
    // 线上格式不受影响：报文是手写二进制编解码 + 字段级 JSON，不含类名。
    // （历史坑：ip2region 曾因无 module-info 的 automatic module 撞过同类问题，
    //   当时用 shade 解决；这里是自己的包，重定位即可。）
    def relocateCommon = tasks.register('relocateCommon', Sync) {
        group = 'build'
        description = '把 common/ 共享源码重定位到 org.voidkit.guard.client.* 供客户端编译'
        from rootProject.file('common/src/main/kotlin')
        into layout.buildDirectory.dir('generated/relocated-common')
        filteringCharset = 'UTF-8'
        filter { String line ->
            line.replace('org.voidkit.guard.common', 'org.voidkit.guard.client.common')
                .replace('org.voidkit.guard.platform', 'org.voidkit.guard.client.platform')
        }
    }

    // 客户端不再直接编 common/，编生成的重定位副本
    sourceSets.main.kotlin.srcDir relocateCommon
    tasks.named('compileKotlin') { dependsOn relocateCommon }

    minecraft {
        mappings channel: 'official', version: rootProject.ext.mcVersion
    }

    dependencies {
        implementation minecraft.dependency("net.minecraftforge:forge:${rootProject.ext.forgeVersion}")
    }

    jarJar.register()

    dependencies {
        // ⚠️ 零 core：客户端不装套件基础设施。
        // 客户端不像服务端有 core 提供 Kotlin 运行时 —— 自己 jarJar 一份。
        // （服务端 jar 由 core 提供 stdlib；两侧各一份不冲突，因为它们在
        //   不同的 jar 里、且都是 module-named jar，不会互相 JPMS 冲突。）
        jarJar("org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}")
    }

    processResources {
        def props = [
                mod_version : project.version,
                neo_range   : rootProject.ext.neoRange,
                mc_range    : rootProject.ext.mcRange,
                loader_range: rootProject.ext.loaderRange,
        ]
        inputs.properties props
        filesMatching(['META-INF/mods.toml']) { expand props }
    }

    // ⚠️ FG7 的 jarJar 产出独立任务：客户端的 kotlin-stdlib 走它。
    //    jarJar 用规范名，普通 jar 退为 -slim。
    tasks.named('jarJar', Jar) {
        archiveFileName = "${modId}-${project.version}+mc${rootProject.ext.mcVersion}-forge.jar"
    }
    tasks.named('jar', Jar) {
        archiveFileName = "${modId}-${project.version}+mc${rootProject.ext.mcVersion}-forge-slim.jar"
    }

    jar {
        // 产物命名规格与套件对齐：<mod>-<version>+mc<mc>-<loader>.jar
        archiveFileName = "${modId}-${project.version}+mc${rootProject.ext.mcVersion}-forge-slim.jar"
        manifest {
            attributes([
                    'Specification-Title'   : modId,
                    'Specification-Vendor'  : rootProject.ext.guardAuthors,
                    'Specification-Version' : '1',
                    'Implementation-Title'  : 'client',
                    'Implementation-Version': project.version,
                    'Implementation-Vendor' : rootProject.ext.guardAuthors,
            ])
        }
    }
}
