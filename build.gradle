plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.1.0' apply false
}

// ==============================================================
// 公共版本。与 voidkit 主仓库保持一致。
// ==============================================================
ext {
    // 全部 release 均为测试版（pre-release），不建议用于生产环境。
    // 与 voidkit 套件其余模块保持同一命名规格：<mod>-0.1.0-beta.1+mc<版本>-<loader>.jar。
    // ⚠️ 版本字面量必须是合法语义化版本：NeoForge/Forge 的 mods.toml 都拒绝
    // 'beta0.1' 这类非数字开头形式（InvalidModFileException: Illegal version
    // number，整个 jar 被跳过不加载，已实测复现）。人类命名 beta0.1 只出现在
    // release title / notes，不进版本号。
    guardVersion = '0.1.0-beta.1'
    guardGroup = 'org.voidkit'
    guardAuthors = 'Kokuu Studio'
    guardLicense = 'MIT'

    mcVersion = '1.21.1'
    // ⚠️ 声明要宽松：同 21.1.x 系列内部二进制兼容，只锁主次版本。
    neoVersion = '21.1.209'
    neoRange = '[21.1.0,21.2.0)'
    mcRange = '[1.21.1,1.22)'
    loaderRange = '[4,)'

    kotlinVersion = '2.1.0'

    // 封禁/审计/截屏记录用嵌入式 SQLite（零配置、单文件、WAL）。
    sqliteVersion = '3.53.4.0'

    // IP 归属地离线库（ip2region，纯本地查询不联网）。数据是 v4 格式。
    ip2regionVersion = '2.7.0'
}

// ==============================================================
// 所有子项目共用：Java 21 + Kotlin + 仓库 + 编码 + 编译参数
// ==============================================================
subprojects { p ->
    apply plugin: 'java'
    apply plugin: 'org.jetbrains.kotlin.jvm'

    group = rootProject.ext.guardGroup
    version = rootProject.ext.guardVersion

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)
    kotlin { jvmToolchain(21) }

    repositories {
        maven { url = 'https://neoforged.forgecdn.net/releases' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        mavenCentral()
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            freeCompilerArgs.add('-Xjvm-default=all')
        }
    }
}

// ==============================================================
// server —— 服务端 mod（依赖 core）。
//
// 源码 = server/ 自有 + common/ 共享目录（协议/加密/模型/platform 接口）。
// 客户端不装 core，见下面的 client 块。
// ==============================================================
project(':server') {
    apply plugin: 'net.neoforged.moddev'

    def modId = 'voidkit_guard'
    base { archivesName = modId }

    // common 是共享源码目录，直接编进本 jar（不是独立 Gradle 项目）
    sourceSets.main.kotlin.srcDir rootProject.file('common/src/main/kotlin')

    neoForge {
        version = rootProject.ext.neoVersion
        mods {
            "${modId}" {
                sourceSet(sourceSets.main)
            }
        }
        runs {
            // 开发服务端：core + guard 都从 classpath 加载，与整合包真实加载路径一致
            server {
                server()
                programArgument '--nogui'
            }
        }
    }

    dependencies {
        // 组合构建把 org.voidkit:core 替换成本地 :core（并入主仓库时用 project(':core')）
        implementation 'org.voidkit:core:1.2.0'

        // SQLite 驱动：jarJar 内置（约 13MB 原生库）
        jarJar(implementation("org.xerial:sqlite-jdbc")) {
            version {
                strictly '[3.46,)'
                prefer rootProject.ext.sqliteVersion
            }
        }
        // ip2region 绑定（纯 Java ~100KB）；11MB xdb 走 resources
        jarJar(implementation("org.lionsoul:ip2region")) {
            version {
                strictly '[2.7,)'
                prefer rootProject.ext.ip2regionVersion
            }
        }
    }

    // ⚠️ 开发运行时从 classes 目录加载，jarJar 的嵌套 jar 不生效 —— SQLite/ip2region
    // 原生库必须显式补进 run 的 classpath，否则一用就 NoClassDefFoundError。
    // 🚨 kotlin-stdlib **不要**在这里补：core 的 jarJar 已提供，两边都是 module-named
    // jar 会 JPMS ResolutionException（"reads more than one module named kotlin.stdlib"）。
    afterEvaluate {
        dependencies {
            additionalRuntimeClasspath "org.xerial:sqlite-jdbc:${rootProject.ext.sqliteVersion}"
            additionalRuntimeClasspath "org.lionsoul:ip2region:${rootProject.ext.ip2regionVersion}"
        }
    }

    processResources {
        def props = [
                mod_version : project.version,
                neo_range   : rootProject.ext.neoRange,
                mc_range    : rootProject.ext.mcRange,
                loader_range: rootProject.ext.loaderRange,
        ]
        inputs.properties props
        filesMatching(['META-INF/neoforge.mods.toml']) { expand props }
    }

    jar {
        // 产物命名规格与套件对齐：<mod>-<version>+mc<mc>-<loader>.jar
        archiveFileName = "${modId}-${project.version}+mc${rootProject.ext.mcVersion}-neoforge.jar"
        manifest {
            attributes([
                    'Specification-Title'   : modId,
                    'Specification-Vendor'  : rootProject.ext.guardAuthors,
                    'Specification-Version' : '1',
                    'Implementation-Title'  : 'server',
                    'Implementation-Version': project.version,
                    'Implementation-Vendor' : rootProject.ext.guardAuthors,
            ])
        }
    }
}

// ==============================================================
// client —— 客户端 mod（**零 core 依赖**）。
//
// 源码 = client/ 自有 + common/ 共享目录。jar 里没有一行服务端代码，
// 也没有一行 core 引用 —— 反编译客户端拿不到服务端的密钥处理与检测策略。
// ==============================================================
project(':client') {
    apply plugin: 'net.neoforged.moddev'

    def modId = 'voidkit_guard_client'
    base { archivesName = modId }

    sourceSets.main.kotlin.srcDir rootProject.file('common/src/main/kotlin')

    neoForge {
        version = rootProject.ext.neoVersion
        mods {
            "${modId}" {
                sourceSet(sourceSets.main)
            }
        }
    }

    dependencies {
        // ⚠️ 零 core：客户端不装套件基础设施。
        // 客户端不像服务端有 core 提供 Kotlin 运行时 —— 自己 jarJar 一份。
        jarJar(implementation("org.jetbrains.kotlin:kotlin-stdlib")) {
            version {
                strictly '[2.1,)'
                prefer rootProject.ext.kotlinVersion
            }
        }
    }

    processResources {
        def props = [
                mod_version : project.version,
                neo_range   : rootProject.ext.neoRange,
                mc_range    : rootProject.ext.mcRange,
                loader_range: rootProject.ext.loaderRange,
        ]
        inputs.properties props
        filesMatching(['META-INF/neoforge.mods.toml']) { expand props }
    }

    jar {
        // 产物命名规格与套件对齐：<mod>-<version>+mc<mc>-<loader>.jar
        archiveFileName = "${modId}-${project.version}+mc${rootProject.ext.mcVersion}-neoforge.jar"
        manifest {
            attributes([
                    'Specification-Title'   : modId,
                    'Specification-Vendor'  : rootProject.ext.guardAuthors,
                    'Specification-Version' : '1',
                    'Implementation-Title'  : 'client',
                    'Implementation-Version': project.version,
                    'Implementation-Vendor' : rootProject.ext.guardAuthors,
            ])
        }
    }
}
