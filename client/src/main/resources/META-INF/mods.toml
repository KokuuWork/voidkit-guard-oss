modLoader = "javafml"
loaderVersion = "${loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/KokuuWork/voidkit/issues"

[[mods]]
modId = "voidkit_guard_client"
version = "${mod_version}"
displayName = "VoidkitGuard Client"
authors = "Kokuu Studio"
description = '''
VoidkitGuard 反作弊组件 —— 客户端 Agent。

配合服务端 voidkit_guard 使用：响应握手校验、采集设备标识、按需截屏取证、
本机信息扫描。独立轻量 mod，不依赖任何套件基础设施。
'''

# ⚠️ Forge 1.20.1 的 mods.toml 只认 mandatory = true/false（NeoForge 1.20.2+ 的
#    type = "required" 字段在这里会让 Forge 拒绝加载整个 jar）。
[[dependencies.voidkit_guard_client]]
modId = "forge"
mandatory = true
versionRange = "${neo_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.voidkit_guard_client]]
modId = "minecraft"
mandatory = true
versionRange = "${mc_range}"
ordering = "NONE"
side = "BOTH"
